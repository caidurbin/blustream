# HA Integration Quality Scale declarations for the Blustream integration.
# See ADRs 0009 / 0012 for the gold-tier commitment and operational choices.

rules:
  # ---- Bronze ----
  action-setup:
    status: exempt
    comment: |
      No service actions registered in v0.1 (read-only uptime sensor).
  appropriate-polling:
    status: done
    comment: |
      30 s update interval; protocol is local TCP and the device tolerates
      bursty polling. Hardcoded for v0.1, no options flow.
  brands: done
  common-modules:
    status: done
    comment: |
      Coordinator in coordinator.py; entity-base inheritance via
      CoordinatorEntity directly (single platform in v0.1).
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: |
      100% coverage on config_flow.py: user step happy path, invalid_mac,
      cannot_connect, unknown, and already_configured.
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: |
      No service actions registered in v0.1.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: |
      No event subscriptions; the coordinator drives all state.
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: |
      Coordinator stored on entry.runtime_data via typed
      BlustreamConfigEntry alias; hass.data[DOMAIN] is not used.
  test-before-configure:
    status: done
    comment: |
      Config flow connects, fetches uptime, and disconnects before
      creating the entry. cannot_connect distinguished from unknown.
  test-before-setup:
    status: done
    comment: |
      async_config_entry_first_refresh() runs in async_setup_entry;
      ConfigEntryNotReady raised transitively when the device is offline.
  unique-config-entry:
    status: done
    comment: |
      MAC-bearing entries set unique_id = format_mac(mac); duplicate MACs
      abort with already_configured.

  # ---- Silver ----
  action-exceptions:
    status: exempt
    comment: |
      No service actions registered in v0.1.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: |
      No options flow in v0.1.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      Inherited from CoordinatorEntity.available, which returns
      coordinator.last_update_success.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      _async_update_data raises UpdateFailed; HA's DataUpdateCoordinator
      logs once on down/up transitions automatically.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: |
      No credentials / no auth surface on the DMP168 protocol.
  test-coverage:
    status: done
    comment: |
      ≥95% on every non-config-flow module.

  # ---- Gold ----
  devices: done
  diagnostics:
    status: done
    comment: |
      async_get_config_entry_diagnostics returns
      {config_entry, device, data}. Host, MAC, hostname, unique_id, and
      device-registry connections / identifiers run through
      async_redact_data. Coordinator state (last_update_success, last
      uptime, interval), parsed status via SystemStatus.to_dict(), raw
      uptime via get_uptime_raw(), and integration + library versions
      are included.
  discovery-update-info:
    status: done
    comment: |
      DHCP discovery for already-configured entries updates CONF_HOST
      silently via _abort_if_unique_id_configured(updates={CONF_HOST: ip})
      -- IP-change path, no user prompt, no loss of entity history.
  discovery:
    status: done
    comment: |
      DHCP matcher in manifest.json scoped to Blustream's 28-bit MA-M
      prefix (34D0B82*). async_step_dhcp confirms new devices and routes
      IP changes for already-configured entries to the update path.
      Zeroconf is declared as discovery-UX assist only -- the DMP168's
      mDNS name is the fixed, non-unique DMP168.local and carries no
      identity (ADR 0010). async_step_zeroconf routes the user into the
      manual step with the host pre-filled and sets no unique_id;
      manual or entry-id identity takes over.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      1:1 config-entry-to-device integration; no dynamic per-entry device
      enumeration.
  entity-category: done
  entity-device-class:
    status: done
    comment: |
      The single sensor uses SensorDeviceClass.UPTIME. The canonical
      ``utcnow() - timedelta`` pattern (also used by wled, fritz,
      brother) is safe per-poll: HA's SensorEntity._normalize_uptime
      applies a 60 s UPTIME_DEFAULT_TOLERANCE_SECONDS so per-poll
      clock drift does not generate spurious state changes, and we
      therefore don't quantize in our code.
  entity-disabled-by-default:
    status: exempt
    comment: |
      The single uptime sensor is the integration's reason to exist;
      hiding it by default would defeat the install.
  entity-translations: done
  exception-translations:
    status: exempt
    comment: |
      The integration raises no user-facing exceptions, so there is no
      exception message to translate. Config-flow failures surface as
      form error keys (cannot_connect / invalid_mac / unknown) and abort
      reasons (already_configured / mac_mismatch) defined in strings.json;
      the MAC-mismatch repair surfaces through an issue-registry
      translation_key; and the coordinator's UpdateFailed is logged via
      the log-when-unavailable path, not shown to the user. No
      HomeAssistantError subclass is raised across config flow, the
      reconfigure flow (#34), or the repair flow (#36).
  icon-translations:
    status: exempt
    comment: |
      Standard device-class icon for SensorDeviceClass.UPTIME suffices.
  reconfiguration-flow:
    status: done
    comment: |
      async_step_reconfigure edits host, port, and MAC in place,
      pre-filling the form with the entry's current values; entity
      history is preserved (entry_id and unique_id stay unless the
      MAC actually changes). Well-formedness-only invalid_mac
      validation matches async_step_user.
  repair-issues:
    status: done
    comment: |
      MAC-mismatch repair issue (ADR 0010 / no-automatic-rewrites): when
      DHCP rediscovers a different MAC for an already-configured host, or
      a reconfigure submits a MAC that would collide with another entry,
      the config flow creates a fixable issue via
      issue_registry.async_create_issue(is_fixable=True) and aborts with
      reason="mac_mismatch" rather than silently rewriting unique_id.
      repairs.MacMismatchRepairFlow resolves it: "confirm replacement"
      adopts the new MAC on the existing entry (entry_id preserved so
      entity history survives) and reloads; "restore" treats the
      observed MAC as transient and clears the issue without touching
      the entry.
  stale-devices:
    status: exempt
    comment: |
      1:1 config-entry-to-device integration; the device cannot become
      stale independently of the config entry. async_remove_config_entry_device
      is intentionally absent so HA hides the Delete Device button.

  # ---- Platinum ----
  async-dependency: done
  inject-websession:
    status: exempt
    comment: |
      Library uses TCP (telnetlib3), not HTTP/aiohttp.
  strict-typing:
    status: todo
    comment: |
      Platinum rule, above the committed Gold tier and therefore not
      required for this sign-off (hassfest only enforces rules at or
      below the declared tier). Deliberately deferred per ADR 0009/0012:
      a reachable stretch goal, not committed for v0.1.0. The library
      ships py.typed so Platinum stays reachable without later
      library-side breaking churn.
