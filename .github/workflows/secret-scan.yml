name: "Secret scan"

# Server-side secret scan. betterleaks scans the whole working tree using the
# shared .gitleaks.toml (the same config the local pre-commit hook and the
# Claude hook layer use) so a real device identifier — IPv4/IPv6/MAC outside the
# IETF documentation ranges — cannot be committed. The pre-commit hook's
# `--staged` mode is a no-op in CI (nothing is staged), so we scan directly.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Install betterleaks
        # Pinned to the same tag as the betterleaks hook in .pre-commit-config.yaml.
        run: |
          go install github.com/betterleaks/betterleaks@v1.4.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan working tree (shared .gitleaks.toml)
        run: betterleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner
