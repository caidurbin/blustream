name: "Test: Control4"

# busted unit tests for the Control4 driver. Lua 5.1 is pinned because Control4
# drivers run inside the Composer Lua 5.1 sandbox; CI must test against the same
# version the driver targets. luacheck linting runs in lint-control4.yml.

on:
  pull_request:
    branches:
      - main
    paths:
      - "control4/**"
      - "spec/**"
      - ".tool-versions"
      - ".github/workflows/test-control4.yml"
  push:
    branches:
      - main
    paths:
      - "control4/**"
      - "spec/**"
      - ".tool-versions"
      - ".github/workflows/test-control4.yml"

permissions:
  contents: read

jobs:
  control4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@e65774a6386cb4f24e293dca7fc4ff89165b64c5 # v4

      - name: Install libyaml (lyaml build dep)
        # lyaml binds libyaml; the Lua VectorRunner uses it to load the same
        # spec/vectors/formatters.yaml the Python runner consumes.
        run: sudo apt-get install -y libyaml-dev

      - name: Install busted, lyaml
        run: |
          luarocks install busted 2.2.0
          luarocks install lyaml

      - name: Run busted
        # Includes control4/dmp168/spec/vector_runner_spec.lua, which calls
        # vector_runner.run_vectors("spec/vectors/formatters.yaml") — the
        # Lua-side acceptance gate that mirrors tests/test_vector_runner.py.
        run: busted --verbose --pattern=_spec control4/
