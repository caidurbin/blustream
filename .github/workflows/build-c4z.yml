name: C4Z build

# Build the Blustream DMP168 .c4z artifacts via snap-one/drivers-driverpackager.
# Both flavors are built on every PR/push (dev = -ae, release = clean) so a
# regression in either is caught immediately. The release artifact is uploaded
# as a workflow artifact for download/inspection. Tag-driven publication to
# GitHub Releases lands in a later slice (see docs/control4-driver-plan.md
# §"Distribution and versioning").

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-c4z:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install drivers-driverpackager runtime deps
        # snap-one/drivers-driverpackager (dp3/) imports lxml at module scope.
        # Installed via the `c4z` extra so the lxml version is single-sourced
        # in pyproject.toml rather than pinned ad-hoc here.
        run: |
          python -m pip install --upgrade pip
          pip install '.[c4z]'

      - name: Build dev and release .c4z
        run: |
          python tools/build_c4z.py both --auto-clone

      - name: Upload release .c4z
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blustream-dmp168-release-c4z
          path: dist/c4z/release/*.c4z
          retention-days: 30
          if-no-files-found: error

      - name: Upload dev .c4z
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blustream-dmp168-dev-c4z
          path: dist/c4z/dev/*.c4z
          retention-days: 14
          if-no-files-found: error
