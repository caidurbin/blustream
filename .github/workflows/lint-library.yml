name: "Lint: library"

# Ruff lint of all Python except the CLI (which is linted in lint-cli.yml):
# blustream/ (minus cli), custom_components/, spec/, tools/, tests/ and the
# top-level scripts. Mirrors the old `ruff check .` coverage.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run ruff check . --extend-exclude 'blustream/cli,tests/cli'
