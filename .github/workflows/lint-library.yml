name: "Lint: library"

# Ruff lint of all Python except the CLI (which is linted in lint-cli.yml):
# blustream/ (minus cli), custom_components/, spec/, tools/, tests/ and the
# top-level scripts. Mirrors the old `ruff check .` coverage.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run ruff check . --extend-exclude 'blustream/cli,tests/cli'
