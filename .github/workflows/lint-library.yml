name: "Lint: library"

# Ruff lint of the blustream library (everything under blustream/ except the
# CLI, plus the shared tests). The CLI is linted separately in lint-cli.yml.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run ruff check blustream tests --extend-exclude 'blustream/cli,tests/cli'
