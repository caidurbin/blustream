name: HA integration validate

# Runs the canonical Home Assistant integration validators:
#   * hassfest -- manifest/translations/config-flow lint
#   * hacs/action -- HACS-side category=integration validation
# Daily cron is the universal pattern in surveyed HACS integrations;
# catches HA-side breakage that lands between PRs.

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop
  schedule:
    # Daily at 06:13 UTC; offset minute reduces hourly-cron pile-up.
    - cron: "13 6 * * *"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@868e6cb4607727d764341a158d98872cd63fa658 # master @ 2026-05-31

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run HACS validation
        uses: hacs/action@dcb30e72781db3f207d5236b861172774ab0b485 # main @ 2026-05-31
        with:
          category: integration
