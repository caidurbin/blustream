name: Release (.c4z)

# Builds and publishes the Blustream DMP168 Control4 driver `.c4z`
# artifact on `c4-v*` tags. The `c4-v*` prefix is the driver's
# release lane; the Python library uses the disjoint `v*` prefix in
# release-pypi.yml so the two components version independently
# (PRD #9, README "Independent versioning").
#
# The build itself is delegated to `tools/build_c4z.py`, which is
# the same path exercised by `tests/test_c4z_build.py` and the
# regular CI build in `.github/workflows/build-c4z.yml`. Running it
# here keeps the released artifact byte-equivalent to what reviewers
# saw on the merging PR.
#
# No tag-vs-version guard, by design (unlike release-pypi.yml and
# release-hacs.yml). Control4's driver.xml `<version>` is an integer
# that Composer uses for update detection -- it starts at 0 and
# increments -- and is intentionally decoupled from the `c4-v*` release
# semver (see driver.xml's header note; docs/control4-driver-plan.md
# "Independent versioning"). The `.c4z` basename (`blustream-dmp168.c4z`) carries no
# version at all. A `c4-v0.1.0`-vs-`<version>` check would therefore
# compare two unrelated schemes (and reject the intended first release,
# 0.1.0 vs 0). This lane is also the most reversible of the three --
# delete the GitHub release / move the tag -- so a guard's value is low.
# Do not add one without first reconciling the integer/semver split.

on:
  push:
    tags:
      - "c4-v*"

permissions:
  # Creating a GitHub release and attaching artifacts requires write
  # access to repository contents. Without this the publish step
  # silently fails with HTTP 403.
  contents: write

jobs:
  build-and-release:
    name: Build release .c4z and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install drivers-driverpackager runtime deps
        # snap-one/drivers-driverpackager (dp3/) imports lxml at module
        # scope; mirrors the install step in build-c4z.yml so the two
        # workflows do not drift on toolchain. Installed via the `c4z`
        # extra so the lxml version is single-sourced in pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          pip install '.[c4z]'

      - name: Build release .c4z
        # `release` (clean, no -ae) is the flavor that ships to users.
        # `--auto-clone` mirrors build-c4z.yml so the runner doesn't
        # need a pre-staged drivers-driverpackager checkout.
        run: |
          python tools/build_c4z.py release --auto-clone

      - name: Upload .c4z as workflow artifact
        # Belt-and-braces: even if the GitHub release step fails, the
        # built .c4z is still downloadable from the workflow run.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blustream-dmp168-release-c4z
          path: dist/c4z/release/*.c4z
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release and attach .c4z
        # softprops/action-gh-release reads the tag from the trigger
        # ref and creates a release named after the tag (e.g.
        # `c4-v1.0.0`). The `files` glob attaches the built artifact.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/c4z/release/*.c4z
          fail_on_unmatched_files: true
          generate_release_notes: true
