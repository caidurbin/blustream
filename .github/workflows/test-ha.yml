name: "Test: HA"

# Home Assistant integration test suite under pytest-homeassistant-custom-component.
# PHCC pins one HA version per release, so a matrix would mostly exercise PHCC
# versions rather than real-world HA variance -- pin a single Python version to
# match.
#
# Path-scoped: only fires when the integration, the library it consumes, or this
# workflow itself changes.

on:
  pull_request:
    branches:
      - main
    paths:
      - "custom_components/blustream/**"
      - "blustream/**"
      - "tests/components/blustream/**"
      - ".github/workflows/test-ha.yml"
  push:
    branches:
      - main
    paths:
      - "custom_components/blustream/**"
      - "blustream/**"
      - "tests/components/blustream/**"
      - ".github/workflows/test-ha.yml"

permissions:
  contents: read

jobs:
  ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        # PHCC pins one Home Assistant version per release, which sets the
        # HA API surface the tests run against. The uptime sensor depends
        # on SensorDeviceClass.UPTIME and SensorEntity._normalize_uptime,
        # both introduced in HA 2026.5.0 (core PR #164266). That HA -- and
        # every HA since 2026.3.0 -- requires Python 3.14, so the runner
        # above is 3.14 and PHCC is floored at 0.13.329, the first release
        # pinning the 2026.5.0 stable. (PHCC <=0.13.316 pins HA 2026.2.3,
        # which lacks UPTIME, so the conftest guard would skip the whole
        # suite.) Bump deliberately when consuming a newer HA API.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install \
            "pytest-homeassistant-custom-component>=0.13.329" \
            syrupy

      - name: Run integration tests with coverage
        run: |
          pytest tests/components/blustream/ -v --tb=short \
            --cov=custom_components.blustream \
            --cov-report=xml \
            --cov-report=term-missing
