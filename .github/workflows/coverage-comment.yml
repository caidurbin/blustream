name: Coverage Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  coverage-comment:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra codegen
      
      - name: Generate Coverage
        run: |
          uv run pytest --cov=blustream --cov-report=xml --cov-report=term --quiet
      
      - name: Comment Coverage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Get coverage from XML
            const coverageXml = fs.readFileSync('coverage.xml', 'utf8');
            const coverageMatch = coverageXml.match(/line-rate="([^"]+)"/);
            const coverage = coverageMatch ? (parseFloat(coverageMatch[1]) * 100).toFixed(2) : 'N/A';
            
            // Get coverage summary from terminal output
            const coverageOutput = execSync('uv run pytest --cov=blustream --cov-report=term --quiet 2>&1 | tail -20', { encoding: 'utf-8' });
            
            const comment = `## 📊 Code Coverage Report
            
            **Overall Coverage: ${coverage}%**
            
            <details>
            <summary>Coverage Details</summary>
            
            \`\`\`
            ${coverageOutput}
            \`\`\`
            
            </details>
            
            > Coverage reports are available as artifacts in the Actions tab.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

