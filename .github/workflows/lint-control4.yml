name: "Lint: Control4"

# luacheck over the Control4 driver sources. Lua 5.1 is pinned because Control4
# drivers run inside the Composer Lua 5.1 sandbox; CI must lint against the same
# version the driver targets. The busted unit tests run in test-control4.yml.

on:
  pull_request:
    branches:
      - main
    paths:
      - "control4/**"
      - ".luacheckrc"
      - ".tool-versions"
      - ".github/workflows/lint-control4.yml"
  push:
    branches:
      - main
    paths:
      - "control4/**"
      - ".luacheckrc"
      - ".tool-versions"
      - ".github/workflows/lint-control4.yml"

permissions:
  contents: read

jobs:
  control4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6.1.1

      - name: Install luacheck
        run: luarocks install luacheck 1.2.0

      - name: Run luacheck
        run: luacheck .
