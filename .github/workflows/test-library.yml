name: "Test: library"

# Library unit tests across the supported Python matrix, with the codegen drift
# gate and coverage reporting. The CLI suite runs in test-cli.yml, the HA
# integration suite in test-ha.yml, and the Lua suite in test-control4.yml.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra codegen --python ${{ matrix.python-version }}

      - name: Codegen drift gate (regenerate; fail on diff)
        # Mirrors the runtime test_committed_*_generated_is_fresh assertions
        # so a stale checkout fails CI even before pytest collects.
        run: |
          uv run python -m spec.codegen.emit_python
          uv run python -m spec.codegen.emit_lua
          git diff --exit-code -- blustream/devices/dmp168/_generated.py control4/dmp168/src/generated.lua

      - name: Run tests with coverage
        # Library partition: the whole suite except the CLI and HA component
        # tests, which have their own workflows.
        run: |
          uv run pytest tests --ignore=tests/cli --ignore=tests/components \
            -v --tb=short \
            --cov=blustream \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=junit.xml
        continue-on-error: false

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      - name: Coverage Summary
        run: |
          {
            echo "## Coverage Summary (${{ matrix.python-version }})"
            echo '```'
            uv run pytest tests --ignore=tests/cli --ignore=tests/components \
              --cov=blustream --cov-report=term --quiet 2>&1 | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
