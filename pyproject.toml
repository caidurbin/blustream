[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blustream"
dynamic = ["version"]
description = "Python library and CLI for controlling Blustream audio devices"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Cai Durbin" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "telnetlib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # 9.0.3 is the first release with the GHSA-6w46-j5rx-g56g tmpdir fix; requires Python >=3.10
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
codegen = [
    # Build-time only: spec/codegen + spec/runner.py. Library users do not
    # need these at runtime (generated files are committed).
    "Jinja2>=3.0",
    "PyYAML>=6.0",
]
c4z = [
    # Runtime dep of snap-one/drivers-driverpackager (dp3/), which imports
    # lxml at module scope. Needed only to build the Control4 .c4z driver
    # package locally or to run the TestC4zBuildEndToEnd end-to-end tests;
    # the blustream library itself never imports lxml. Mirrors the ad-hoc
    # `pip install lxml` in build-c4z.yml / release-c4z.yml.
    "lxml>=5.0",
]

[project.scripts]
blustream = "blustream.cli.main:main"

[project.urls]
Homepage = "https://github.com/caidurbin/blustream"
Repository = "https://github.com/caidurbin/blustream"
Issues = "https://github.com/caidurbin/blustream/issues"

[tool.setuptools.packages.find]
include = ["blustream*"]

[tool.setuptools.package-data]
# PEP 561 marker: ship the inline type information to downstream consumers.
# Included in both the wheel and the sdist by setuptools.
"blustream" = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "blustream.__version__" }

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__pycache__",
    # Generated by spec/codegen; the committed copy MUST stay byte-identical to
    # the emitter's output (ADR-0007, enforced by
    # test_committed_python_generated_is_fresh). The emitter writes
    # single-quoted literals, so ruff-format must not rewrite them.
    "blustream/devices/dmp168/_generated.py",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.9+
target-version = "py39"

[tool.ruff.lint]
# Enable pycodestyle (E) and Pyflakes (F) by default.
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # Ignore line too long - many error messages are intentionally long
    "E722",  # Allow bare except in timeout handling code
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["blustream"]

